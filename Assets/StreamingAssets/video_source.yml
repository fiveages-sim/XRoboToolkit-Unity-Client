# Video Stream Source Configuration
- name: "PICO4U"
  camera: "VR"
  description: "PICO4U / 4UE enterprise VST source (camera=VR)"
  properties:
    - name: "visibleRatio"
      type: "float"
      description: "Visible ratio for the shader"
      value: 0.555
    - name: "contentRatio"
      type: "float"
      description: "Content ratio for the shader"
      value: 1.8
    - name: "heightCompressionFactor"
      type: "float"
      description: "Height compression factor for the shader"
      value: 1.333333 # 4/3
    - name: "RawImageRectSize"
      type: "string"
      description: "Size of the RawImage rectangle for the stereo view"
      value: "600x225"
    # Listen / StartSendImage profile (robotassistant CameraHandle).
    # 2160x810@60/20Mbps triggers CAPTURE_STATUS_PREPROCESS_ERROR (-99) on 4UE
    # VST push; AAR MediaCodec path is effectively ~5Mbps. Keep 8:3 SBS aspect.
    - name: "CamWidth"
      type: "int"
      description: "Camera width for the video stream"
      value: 1280
    - name: "CamHeight"
      type: "int"
      description: "Camera height for the video stream"
      value: 480
    - name: "CamFPS"
      type: "int"
      description: "Frame rate of the video stream in FPS"
      value: 30
    - name: "CamBitrate"
      type: "int"
      description: "Bitrate of the video stream in bps"
      value: 5000000 # 5 Mbps — matches CameraHandle AAR MediaCodec note

    - name: "AudioStreamPort"
      type: "int"
      description: "Raw PCM audio stream port from the operator bridge"
      value: 13580
  
- name: "ZEDMINI"
  camera: "ZED"
  description: "ZED MINI Video Stream Source"
  properties:
    - name: "visibleRatio"
      type: "float"
      description: "Visible ratio for the shader"
      value: 0.439464
    - name: "contentRatio"
      type: "float"
      description: "Content ratio for the shader"
      value: 1.704850
    - name: "heightCompressionFactor"
      type: "float"
      description: "Height compression factor for the shader"
      value: 1.777778 # 16/9
    - name: "RawImageRectSize"
      type: "string"
      description: "Size of the RawImage rectangle for the stereo view"
      value: "600x168.75"
    - name: "CamWidth"
      type: "int"
      description: "Camera width for the video stream"
      value: 2560
    - name: "CamHeight"
      type: "int"
      description: "Camera height for the video stream"
      value: 720
    - name: "CamFPS"
      type: "int"
      description: "Frame rate of the video stream in FPS"
      value: 60
    - name: "CamBitrate"
      type: "int"
      description: "Bitrate of the video stream in bps"
      value: 4000000
    - name: "AudioStreamPort"
      type: "int"
      description: "Raw PCM audio stream port from the operator bridge"
      value: 13580

# Single immersive preset (official SBS 2560x640). Protocol camera remains "PANORAMA".
- name: "Panorama"
  camera: "PANORAMA"
  description: "Equirectangular side-by-side stereo panorama 2560x640"
  properties:
    - name: "visibleRatio"
      type: "float"
      value: 1.0
    - name: "contentRatio"
      type: "float"
      value: 4.0
    - name: "heightCompressionFactor"
      type: "float"
      value: 1.0
    - name: "RawImageRectSize"
      type: "string"
      value: "600x150"
    - name: "CamWidth"
      type: "int"
      value: 2560
    - name: "CamHeight"
      type: "int"
      value: 640
    - name: "CamFPS"
      type: "int"
      value: 30
    - name: "CamBitrate"
      type: "int"
      value: 6000000
    - name: "AudioStreamPort"
      type: "int"
      value: 13580
